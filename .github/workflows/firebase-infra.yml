name: Firestore security DEV
on:
  pull_request:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'src/data/**'
      - 'src/features/auth/**'
      - 'src/features/workspace/**'
      - 'tests/firestore.rules.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firebase-infra.yml'
  push:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-infra.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: firestore-infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Security rules and account isolation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Firestore rules and multi-account isolation (no browser)
        run: pnpm test:rules
  deploy:
    name: Deploy Firestore rules and indexes DEV
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: firebase-development
    concurrency:
      group: firestore-rules-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard DEV project and commit
        env:
          CONFIGURED_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$CONFIGURED_PROJECT" = "roteiva-web-dev"
          branch="${GITHUB_REF#refs/heads/}"
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA" || {
            echo "Stale SHA: refuse DEV promotion"; exit 1;
          }
          if [ "$branch" != "master" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || exit 1
            owner="${GITHUB_REPOSITORY%%/*}"
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=100")"
            echo "$prs" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" --arg sha "$GITHUB_SHA" '
              any(.[]; .state == "open" and .base.ref == "master" and
                .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha)
            ' >/dev/null || { echo "Only current open PRs may deploy into DEV"; exit 1; }
          fi
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy only Firestore infrastructure
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes --project roteiva-web-dev --non-interactive
