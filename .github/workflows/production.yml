name: Promote approved commit to PROD
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved master SHA
        required: true
      confirmation:
        description: Type DEPLOY ROTEIVA PROD
        required: true
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: roteiva-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/master' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require owner promotion of current approved master
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRMATION" = 'DEPLOY ROTEIVA PROD'
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$APPROVED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/pulls" |
            jq -e 'any(.[]; .merged_at != null and .base.ref == "master")' >/dev/null
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Test application, backend, D1 and user isolation
        run: |
          pnpm test
          pnpm typecheck
          npm run typecheck --prefix api
          npm test --prefix api
          npm run migrate:local --prefix api
          pnpm build:demo
          pnpm build:emulator
          pnpm exec playwright install --with-deps chromium
          pnpm test:firebase
  worker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recheck SHA and exact remote destinations after environment approval
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          node scripts/guard-environment.mjs prod --before-migrations
          node scripts/guard-token-scope.mjs prod
          node scripts/guard-migrations.mjs prod
      - name: Prepare independent Worker secrets for atomic first deployment
        env:
          TOKEN_KEYS: ${{ secrets.TOKEN_KEYS }}
          TRIAL_IDENTITY_HMAC_KEY: ${{ secrets.TRIAL_IDENTITY_HMAC_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          FIREBASE_ADMIN_CREDENTIALS_JSON: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_JSON }}
        run: node scripts/prepare-worker-secrets.mjs prod
      - name: Apply additive schema and seal durable identity
        run: |
          npm run migrate:prod
          node scripts/guard-environment.mjs prod --seal
      - name: Publish approved Worker
        run: npx wrangler deploy --env prod --secrets-file "$RUNNER_TEMP/roteiva-prod-secrets.json"
      - name: Verify protected Worker secret bindings
        run: node scripts/guard-secrets.mjs prod
      - name: Verify deployed environment and authorization
        run: node ../scripts/smoke-environment.mjs prod
  frontend:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-production
    env:
      VITE_APP_MODE: firebase
      VITE_APP_ENV: prod
      VITE_USE_EMULATORS: 'false'
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_DROPBOX_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck current SHA and build PROD from source
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          pnpm build:prod
          node scripts/verify-static-build.mjs dist /
          node scripts/verify-environment-build.mjs prod
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify deployment credential project
        run: node --input-type=module -e "import fs from 'node:fs';if(JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)).project_id!=='roteiva-web-prod')process.exit(1)"
      - name: Publish verified rules, indexes and Hosting
        run: pnpm exec firebase deploy --config firebase.prod.json --only firestore:rules,firestore:indexes,hosting --project roteiva-web-prod --non-interactive
      - run: node scripts/verify-hosting-cache.mjs https://roteiva-web-prod.web.app
      - run: node scripts/smoke-environment.mjs prod
