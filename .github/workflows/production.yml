name: Promote approved commit to PROD
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved master SHA
        required: true
      confirmation:
        description: Type DEPLOY ROTEIVA PROD
        required: true
      domain_cutover:
        description: Publish the domain cutover without D1 or Firestore changes
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: roteiva-production
  cancel-in-progress: false
jobs:
  authorize:
    # Reject stale, unmerged, or unapproved promotions before scheduling the
    # expensive tests. The protected deployment environments remain mandatory.
    if: >-
      github.ref == 'refs/heads/master' &&
      (vars.PRODUCTION_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY ROTEIVA PROD'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require owner promotion of current approved master
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRMATION" = 'DEPLOY ROTEIVA PROD'
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$APPROVED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/pulls" |
            jq -e 'any(.[]; .merged_at != null and .base.ref == "master")' >/dev/null

  checks:
    # Fast application, Worker/D1 and Firestore isolation checks on one runner.
    # The full browser regression runs independently in three isolated shards.
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Unit, TypeScript, Worker, D1 and Firestore rules
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          npm run typecheck --prefix api
          npm test --prefix api
          npm run migrate:local --prefix api
          pnpm test:rules
      - name: Validate the production build before requesting deploy approvals
        run: |
          pnpm build:prod
          node scripts/verify-static-build.mjs dist /
          node scripts/verify-environment-build.mjs prod

  browser:
    # Playwright's file-based sharding retains every desktop and mobile test,
    # but avoids serializing ~13 minutes of E2E on a single GitHub runner.
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Cache browser and Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: ${{ runner.os }}-prod-e2e-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Prepare real-video regression encoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -1
      - name: Build isolated emulator and demo frontends
        run: |
          pnpm build:demo
          pnpm build:emulator
          pnpm exec playwright install --with-deps chromium
      - name: Full desktop/mobile Playwright regression (shard ${{ matrix.shard }}/3)
        env:
          CI: 'true'
        run: |
          pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore \
            "pnpm exec playwright test --shard=${{ matrix.shard }}/3 --reporter=list"
      - name: Institutional Hosting redirects in desktop and mobile Chromium
        if: matrix.shard == 1
        run: pnpm exec playwright test --config playwright.hosting.config.ts --reporter=list
      - name: Virtual library and protected portal with production flags
        if: matrix.shard == 2
        env:
          CI: 'true'
          VITE_VIRTUAL_LIBRARY: 'true'
          VIRTUAL_LIBRARY_E2E: '1'
        run: |
          pnpm exec vite build --mode emulator --outDir dist-virtual
          pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore \
            "pnpm exec playwright test --config playwright.virtual.config.ts --reporter=list"
      - name: Archive failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-browser-shard-${{ matrix.shard }}-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  worker:
    needs: [authorize, checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WRANGLER_SEND_METRICS: 'false'
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the new domain and both Firebase handlers before cutover
        if: inputs.domain_cutover
        run: node ../scripts/verify-domain-app.mjs --before-deploy
      - name: Recheck SHA and exact remote destinations after environment approval
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          node scripts/guard-environment.mjs prod --before-migrations
          node scripts/guard-token-scope.mjs prod
          if [ "$DOMAIN_CUTOVER" = 'true' ]; then
            node scripts/guard-migrations.mjs prod --domain-cutover
            node scripts/guard-environment.mjs prod
          else
            node scripts/guard-migrations.mjs prod
          fi
      - name: Prepare independent Worker secrets for atomic first deployment
        env:
          TOKEN_KEYS: ${{ secrets.TOKEN_KEYS }}
          TRIAL_IDENTITY_HMAC_KEY: ${{ secrets.TRIAL_IDENTITY_HMAC_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          FIREBASE_ADMIN_CREDENTIALS_JSON: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_JSON }}
        run: node scripts/prepare-worker-secrets.mjs prod
      - name: Apply additive schema and seal durable identity
        if: ${{ !inputs.domain_cutover }}
        run: |
          npm run migrate:prod
          node scripts/guard-environment.mjs prod --seal
      - name: Publish approved Worker
        run: |
          set -euo pipefail
          transition=()
          if [ "$DOMAIN_CUTOVER" = 'true' ]; then
            expires="$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ')"
            transition+=(--var "LEGACY_FRONTEND_UNTIL:$expires")
          fi
          npx wrangler deploy --env prod --secrets-file "$RUNNER_TEMP/roteiva-prod-secrets.json" "${transition[@]}"
      - name: Verify protected Worker secret bindings
        run: node scripts/guard-secrets.mjs prod
      - name: Verify deployed environment and authorization
        run: node ../scripts/smoke-environment.mjs prod
  frontend:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-production
    env:
      VITE_APP_MODE: firebase
      VITE_APP_ENV: prod
      VITE_USE_EMULATORS: 'false'
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_DROPBOX_ENABLED: 'true'
      VITE_VIRTUAL_LIBRARY: 'true'
      DOMAIN_CUTOVER: ${{ inputs.domain_cutover }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck current SHA and build PROD from source
        run: |
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          pnpm build:prod
          node scripts/verify-static-build.mjs dist /
          node scripts/verify-environment-build.mjs prod
          node scripts/smoke-environment.mjs prod
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify deployment credential project
        run: node --input-type=module -e "import fs from 'node:fs';if(JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)).project_id!=='roteiva-web-prod')process.exit(1)"
      - name: Publish verified rules, indexes and Hosting
        if: ${{ !inputs.domain_cutover }}
        run: pnpm exec firebase deploy --config firebase.prod.json --only firestore:rules,firestore:indexes,hosting:roteiva-web-prod --project roteiva-web-prod --non-interactive
      - name: Publish the app Hosting site for the domain cutover
        if: ${{ inputs.domain_cutover }}
        run: pnpm exec firebase deploy --config firebase.prod.json --only hosting:roteiva-web-prod --project roteiva-web-prod --non-interactive
      - run: node scripts/verify-hosting-cache.mjs https://app.roteiva.com
      - run: node scripts/verify-domain-app.mjs
      - run: node scripts/smoke-environment.mjs prod
