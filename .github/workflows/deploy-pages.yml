name: Build and deploy Roteiva demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate static frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate domain logic and TypeScript
        run: |
          pnpm run test
          pnpm run typecheck
      - name: Build Firebase Hosting output
        run: |
          pnpm run build
          node scripts/verify-static-build.mjs dist /
      - name: Build GitHub Pages demo
        run: |
          pnpm run build:pages
          node scripts/verify-static-build.mjs dist-pages /roteiva-web/
      - name: Validate Firebase isolation and browser flows
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run build:emulator
          pnpm run test:firebase
      - name: Report browser failure context
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';
          for (const entry of await readdir('test-results',{recursive:true}).catch(()=>[])) {
            if (entry.endsWith('error-context.md')) console.log(entry+'\n'+await readFile('test-results/'+entry,'utf8'));
          }
          NODE
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: Publish Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
