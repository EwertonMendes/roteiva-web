name: Build and deploy Roteiva demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      prepare_firebase_dependencies:
        description: 'One-time dependency lockfile preparation on the Firebase feature branch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_firebase_dependencies && github.ref == 'refs/heads/codex/firebase-dev-auth-firestore'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm add firebase@latest
      - run: pnpm add -D firebase-tools@latest @firebase/rules-unit-testing@latest @playwright/test@latest
      - name: Commit dependency manifests only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'build: lock Firebase SDK, emulators and browser test dependencies'
          git push origin HEAD:codex/firebase-dev-auth-firestore

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare_firebase_dependencies
    name: Validate static frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate domain logic and TypeScript
        run: |
          pnpm run test
          pnpm run typecheck
      - name: Build Firebase Hosting output
        run: |
          pnpm run build
          node scripts/verify-static-build.mjs dist /
      - name: Build GitHub Pages demo
        run: |
          pnpm run build:pages
          node scripts/verify-static-build.mjs dist-pages /roteiva-web/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: Publish Pages
    if: github.event_name != 'pull_request' && !inputs.prepare_firebase_dependencies
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
