name: Build and deploy Roteiva demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate static frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate domain logic and TypeScript
        run: |
          pnpm run test
          pnpm run typecheck
      - name: Build Firebase Hosting output
        run: |
          pnpm run build
          node scripts/verify-static-build.mjs dist /
      - name: Build GitHub Pages demo
        run: |
          pnpm run build:pages
          node scripts/verify-static-build.mjs dist-pages /roteiva-web/
      - name: Validate Firebase isolation and browser flows
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run build:emulator
          pnpm run test:firebase
      - name: Report browser failure context
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';
          for (const entry of await readdir('test-results',{recursive:true}).catch(()=>[])) {
            if (entry.endsWith('error-context.md')) console.log(entry+'\n'+await readFile('test-results/'+entry,'utf8'));
          }
          NODE
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  preview:
    name: Preview Firebase Hosting (PR 29)
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 29 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/library-explorer-ux'
    runs-on: ubuntu-latest
    environment: firebase-development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and validate frontend preview
        run: |
          pnpm run build
          node scripts/verify-static-build.mjs dist /
      - name: Guard isolated Firebase DEV target
        env:
          CONFIGURED_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: test "$CONFIGURED_PROJECT" = "roteiva-web-dev"
      - name: Authenticate existing protected deployment identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish ONLY the PR 29 preview channel (never live)
        run: |
          pnpm exec firebase hosting:channel:deploy pr-29 \
            --project roteiva-web-dev \
            --expires 7d \
            --non-interactive

  deploy:
    name: Publish Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
