name: Isolated SaaS access E2E
on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/browser/access-isolated-e2e.spec.ts'
      - 'tests/browser/fixtures.ts'
      - 'api/src/access.ts'
      - 'api/src/account-deletion.ts'
      - 'firestore.rules'
      - '.github/workflows/qa-isolated-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-access-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-e2e:
    name: Worker tests, emulator rules and desktop/mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Test actual D1/deletion saga in isolated Node backend
        working-directory: api
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: Compile exclusively for Firebase emulators
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build:emulator
          pnpm build:demo
      - name: Verify Firebase Rules and full desktop/mobile browser suite
        env:
          CI: 'true'
        run: pnpm test:firebase
      - name: Archive failure traces, never credentials
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-access-qa-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
