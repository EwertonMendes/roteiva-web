name: Isolated SaaS access E2E
on:
  push:
    branches: [master]
    paths:
      - 'src/features/reviews/**'
      - 'api/src/reviews.ts'
      - 'api/src/review-media.ts'
      - 'tests/browser/reviews*.ts'
      - '.github/workflows/qa-isolated-e2e.yml'
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    branches: [master]
    paths:
      - 'src/features/reviews/**'
      - 'api/src/reviews.ts'
      - 'api/src/review-media.ts'
      - 'api/tests/reviews.test.mjs'
      - 'api/migrations/**'
      - 'tests/browser/reviews*.ts'
      - 'tests/browser/access-isolated-e2e.spec.ts'
      - 'tests/browser/fixtures.ts'
      - 'src/features/access/**'
      - 'src/features/auth/**'
      - 'src/features/settings/AccountDeletionAction.tsx'
      - 'api/src/access.ts'
      - 'api/src/auth.ts'
      - 'api/src/trial-identity.ts'
      - 'api/src/account-deletion.ts'
      - 'firestore.rules'
      - '.github/workflows/qa-isolated-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-access-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-e2e:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    name: Worker tests, emulator rules and desktop/mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # API DEV and Firestore security DEV already verify Worker/D1 and rules
      # on every PR. Do not repeat their full tests inside the browser job.
      - name: Compile exclusively for Firebase emulators
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build:emulator
          pnpm build:demo
      - name: Fast approval/access smoke — desktop and mobile
        if: github.event_name == 'pull_request'
        env:
          CI: 'true'
        run: >
          pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore
          "pnpm exec playwright test tests/browser/reviews.spec.ts tests/browser/reviews-workflow.spec.ts
          tests/browser/access-isolated-e2e.spec.ts --workers=1 --reporter=line"
      - name: Full desktop/mobile regression and Firebase Rules — master / nightly / manual
        if: github.event_name != 'pull_request'
        env:
          CI: 'true'
        run: pnpm test:firebase
      - name: Archive failure traces, never credentials
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-access-qa-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Temporary maintenance job: run only by explicit workflow_dispatch on this
  # repository-owned PR branch. No Cloudflare/Firebase/Dropbox secrets are read.
  lockfile-refresh:
    name: Regenerate patched pnpm lockfile (manual, no deployment)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/dropbox-storage-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Guard internal PR 87, triggering actor and exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ github.actor }}" = "EwertonMendes"
          test "$GITHUB_REF" = "refs/heads/feat/dropbox-storage-integration"
          actual="$(gh api repos/$GITHUB_REPOSITORY/pulls/87 --jq '.head.sha')"
          test "$actual" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve only patched versions and verify reproducibility
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level high
          git diff --check
      - name: Commit only regenerated lockfile to this exact PR branch
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "security(deps): regenerate lockfile for patched advisories"
            git push origin HEAD:refs/heads/feat/dropbox-storage-integration
          fi
