name: Review room PR - guarded manual DEV promotion
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository review-room PR targeting master'
        type: number
        required: true
      pr_sha:
        description: 'Exact current 40-character PR head commit SHA'
        type: string
        required: true
      confirmation:
        description: 'Type PUBLICAR_APROVACOES_DEV to publish API and Hosting to DEV only'
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: reviews-pr-manual-dev-promotion
  cancel-in-progress: false

jobs:
  verify:
    name: Authorize exact reviewed PR commit (without deployment secrets)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      number: ${{ steps.guard.outputs.number }}
    steps:
      - name: Require owner, explicit confirmation, current PR SHA and green checks
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = 'EwertonMendes'
          test "$GITHUB_REPOSITORY" = 'EwertonMendes/roteiva-web'
          test "$CONFIRMATION" = 'PUBLICAR_APROVACOES_DEV'
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA'; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$PR_SHA" '
            .state == "open" and .draft == false and .base.ref == "master"
            and .head.repo.full_name == $repo
            and .head.sha == $sha and .user.login == "EwertonMendes"
          ' <<< "$pr" >/dev/null

          # Secrets may only reach a review-specific, same-repo PR. A PR cannot
          # modify CI, dependencies, Wrangler, migrations, or deployment scripts.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          test -n "$files"
          while IFS= read -r path; do
            case "$path" in
              api/src/reviews.ts|api/tests/reviews.test.mjs|src/features/reviews/*|src/features/ui/workspace-page-heading.css|tests/browser/reviews-workflow.spec.ts) ;;
              *) echo "Forbidden file in privileged promotion: $path"; exit 1 ;;
            esac
          done <<< "$files"

          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_SHA/check-runs?per_page=100")"
          for name in 'Validate Worker and D1' 'Validate frontend' 'Worker tests, emulator rules and desktop/mobile E2E'; do
            jq -e --arg name "$name" '
              [.check_runs[] | select(.name == $name and .conclusion == "success")] | length > 0
            ' <<< "$checks" >/dev/null || { echo "Required green check absent: $name"; exit 1; }
          done
          echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild and validate the exact source without privileged secrets
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          pnpm build
          node scripts/verify-static-build.mjs dist /
          cd api
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

  api:
    name: Promote reviewed PR Worker to Cloudflare DEV
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-development
    concurrency:
      group: api-worker-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Recheck PR, exact HEAD, and known DEV bindings before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.verify.outputs.number }}
          PR_SHA: ${{ needs.verify.outputs.sha }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test "$ACCOUNT" = 'b3855f9c192541a01a45b2dae7b6a7f8'
          test "$DATABASE" = '302adc88-76b2-4827-bb16-99662fa0408b'
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$PR_SHA"
          grep -q '"name": "roteiva-api-dev"' wrangler.jsonc
      - name: Protect existing D1 state, run migrations and deploy Worker to DEV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-trial-secret.mjs
          node scripts/check-access-migration.mjs --before
          npm run migrate:dev
          node scripts/check-access-migration.mjs
          npm run deploy:dev
      - name: Verify published DEV API and unauthenticated access protection
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://roteiva-api-dev.ewertonmendes9.workers.dev';
          const health=await fetch(root+'/health',{cache:'no-store'});
          assert.equal(health.status,200);
          assert.deepEqual(await health.json(),{status:'ok',environment:'dev'});
          const secured=await fetch(root+'/integrations/drive',{headers:{Authorization:'Bearer invalid'}});
          assert.equal(secured.status,401);
          NODE

  frontend:
    name: Promote reviewed PR Hosting to Firebase DEV
    needs: [verify, api]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: firebase-development
    concurrency:
      group: frontend-hosting-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck PR SHA and exact Firebase DEV project
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.verify.outputs.number }}
          PR_SHA: ${{ needs.verify.outputs.sha }}
          CONFIGURED_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$CONFIGURED_PROJECT" = 'roteiva-web-dev'
          test "$(git rev-parse HEAD)" = "$PR_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$PR_SHA"
      - name: Build verified frontend and check live Worker availability
        run: |
          set -euo pipefail
          pnpm build
          node scripts/verify-static-build.mjs dist /
          node scripts/check-access-worker.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Hosting only to DEV (never Firestore data or PROD)
        run: pnpm exec firebase deploy --only hosting --project roteiva-web-dev --non-interactive
      - name: Verify published DEV hosting cache
        run: node scripts/verify-hosting-cache.mjs https://roteiva-web-dev.web.app
