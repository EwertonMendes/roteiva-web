name: QA regression (manual or nightly)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Regression scope'
        type: choice
        required: true
        default: full
        options: [full, drive, cursor, review, money]
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: read
concurrency:
  group: qa-regression-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true
jobs:
  regression:
    name: Full security and desktop/mobile browser regression
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --ignore-scripts --prefix api
      - name: Install browser and compile isolated emulator/demo modes
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build:emulator
          pnpm build:demo
      - name: Run Firestore isolation and Chromium desktop/mobile suite
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        run: pnpm test:firebase
      - name: Run isolated Drive browser scenarios
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'drive'
        run: pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore "pnpm exec playwright test tests/browser/drive-folders.spec.ts"
      - name: Validate custom cursor, select popovers and native cover editor (desktop)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'cursor'
        run: pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore "pnpm exec playwright test tests/browser/cursor-layer.spec.ts tests/browser/project-covers.spec.ts --project=desktop"
      - name: Validate public and Google-restricted review guard flows (desktop and mobile)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'review'
        run: pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore "pnpm exec playwright test tests/browser/reviews.spec.ts tests/browser/reviews-workflow.spec.ts"
      - name: Validate shared BRL money inputs in desktop and mobile browsers
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'money'
        run: pnpm exec firebase emulators:exec --project demo-roteiva --only auth,firestore "pnpm exec playwright test tests/browser/money-input.spec.ts"
      - name: Backend saga with isolated D1 and Firebase emulators
        if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["cursor","review","money"]'), inputs.suite)
        run: pnpm test:trial:e2e
      - name: Archive failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
