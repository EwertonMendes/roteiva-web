name: Publish reviewed Drive cache to DEV
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed feature commit to publish to DEV
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  WRANGLER_SEND_METRICS: 'false'
concurrency:
  group: roteiva-api-dev-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.actor == 'EwertonMendes' &&
      github.ref == 'refs/heads/codex/drive-token-cache' &&
      inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Require successful frontend CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner, repo:context.repo.repo,
              workflow_id:'deploy-pages.yml', head_sha:context.sha, event:'pull_request', per_page:20,
            });
            if (!data.workflow_runs.some(run=>run.head_sha===context.sha && run.conclusion==='success')) {
              core.setFailed('The exact commit must pass the existing frontend PR workflow before DEV publication.');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run migrate:local
      - run: npm run build
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-development
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Guard existing DEV resources
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test "$ACCOUNT" = "b3855f9c192541a01a45b2dae7b6a7f8"
          test "$DATABASE" = "302adc88-76b2-4827-bb16-99662fa0408b"
      - name: Apply versioned additive migration, then publish DEV API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run migrate:dev
          npm run deploy:dev
      - name: Verify health and authentication
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://roteiva-api-dev.ewertonmendes9.workers.dev';
          const health=await fetch(base+'/health');
          assert.equal(health.status,200);
          assert.deepEqual(await health.json(),{status:'ok',environment:'dev'});
          assert.equal((await fetch(base+'/integrations/drive',{headers:{Authorization:'Bearer invalid'}})).status,401);
          NODE
