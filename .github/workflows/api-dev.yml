name: Roteiva API DEV
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roteiva-api-dev-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run migrate:local
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dependency-lock
          path: api/package-lock.json
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-development
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: api-dependency-lock
          path: api
      - run: npm ci --ignore-scripts
      - name: Guard DEV resources
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test "$ACCOUNT" = "b3855f9c192541a01a45b2dae7b6a7f8"
          test "$DATABASE" = "302adc88-76b2-4827-bb16-99662fa0408b"
      - name: Apply additive versioned DEV migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:dev
      - name: Deploy validated API to DEV only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
      - name: Verify deployed health and reject invalid identity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://roteiva-api-dev.ewertonmendes9.workers.dev';
          const response=await fetch(base+'/health');
          assert.equal(response.status,200);
          assert.deepEqual(await response.json(),{status:'ok',environment:'dev'});
          const denied=await fetch(base+'/integrations/drive',{headers:{Authorization:'Bearer invalid'}});
          assert.equal(denied.status,401);
          NODE
