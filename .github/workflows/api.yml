name: API DEV
on:
  pull_request:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
    inputs:
      deploy_review_dev:
        description: 'Deploy PR 55 branch to existing DEV (requires deliberate opt-in)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
concurrency:
  group: api-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Tests, typecheck, migrations and bundle
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run migrate:local
          npm run build
  deploy:
    name: Deploy Cloudflare Worker DEV
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/reviews-mvp' && inputs.deploy_review_dev == true)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: cloudflare-development
    concurrency:
      group: api-worker-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Guard DEV bindings and current SHA
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test "$ACCOUNT" = "b3855f9c192541a01a45b2dae7b6a7f8"
          test "$DATABASE" = "302adc88-76b2-4827-bb16-99662fa0408b"
          TARGET_REF=master
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/feat/reviews-mvp" || exit 1
            TARGET_REF=feat/reviews-mvp
          fi
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$GITHUB_SHA" || {
            echo "Outdated SHA: skip stale DEV deploy"; exit 1;
          }
      - name: Verify anti-replay Worker secret is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-trial-secret.mjs
      - name: Apply versioned migrations before Worker rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/check-access-migration.mjs --before
          npm run migrate:dev
      - name: Verify additive access schema and existing row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-access-migration.mjs
      - name: Publish compatible Worker to DEV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
      - name: Smoke-test health and reject unauthenticated access
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://roteiva-api-dev.ewertonmendes9.workers.dev';
          const response=await fetch(base+'/health');
          assert.equal(response.status,200);
          assert.deepEqual(await response.json(),{status:'ok',environment:'dev'});
          const denied=await fetch(base+'/integrations/drive',{headers:{Authorization:'Bearer invalid'}});
          assert.equal(denied.status,401);
          NODE
