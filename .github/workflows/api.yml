name: API DEV
on:
  pull_request:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
env:
  WRANGLER_SEND_METRICS: 'false'
concurrency:
  group: api-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked dependencies (cached first, bounded registry fallback)
        run: |
          npm ci --ignore-scripts --offline --no-audit --no-fund ||
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000
      - name: Tests, typecheck, migrations and bundle
        run: |
          npm run typecheck
          npm test
          npm run migrate:local
          npm run build
          node scripts/ci-security-audit.mjs
  deploy:
    name: Deploy Cloudflare Worker DEV
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cloudflare-development
    concurrency:
      group: api-worker-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked dependencies (cached first, bounded registry fallback)
        run: |
          npm ci --ignore-scripts --offline --no-audit --no-fund ||
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000
      - name: Guard DEV bindings and current SHA
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$ACCOUNT" = "b3855f9c192541a01a45b2dae7b6a7f8"
          test "$DATABASE" = "302adc88-76b2-4827-bb16-99662fa0408b"
          branch="${GITHUB_REF#refs/heads/}"
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA" || {
            echo "Stale SHA: refuse DEV promotion"; exit 1;
          }
          if [ "$branch" != "master" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || exit 1
            owner="${GITHUB_REPOSITORY%%/*}"
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=100")"
            echo "$prs" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" --arg sha "$GITHUB_SHA" '
              any(.[]; .state == "open" and .base.ref == "master" and
                .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha)
            ' >/dev/null || { echo "Only current open PRs may deploy into DEV"; exit 1; }
          fi
      - name: Verify anti-replay Worker secret is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-trial-secret.mjs
      - name: Apply versioned migrations before Worker rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/check-access-migration.mjs --before
          npm run migrate:dev
      - name: Verify additive access schema and existing row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-access-migration.mjs
      - name: Publish compatible Worker to DEV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
      - name: Smoke-test health and reject unauthenticated access
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://roteiva-api-dev.ewertonmendes9.workers.dev';
          const response=await fetch(base+'/health');
          assert.equal(response.status,200);
          assert.deepEqual(await response.json(),{status:'ok',environment:'dev'});
          const denied=await fetch(base+'/integrations/drive',{headers:{Authorization:'Bearer invalid'}});
          assert.equal(denied.status,401);
          NODE
