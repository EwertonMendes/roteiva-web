name: Deploy Firebase DEV

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and deploy Roteiva demo"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: firebase-roteiva-web-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Validate and publish roteiva-web-dev
    runs-on: ubuntu-latest
    environment: firebase-development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate manual publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm test
          pnpm typecheck
          pnpm build:pages
          pnpm build:emulator
          pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate security before manual publication
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:firebase
      - run: pnpm build && node scripts/verify-static-build.mjs dist /
      - name: Guard DEV project
        env:
          CONFIGURED_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$CONFIGURED_PROJECT" = "roteiva-web-dev" || { echo "Deploy permitido somente em roteiva-web-dev"; exit 1; }
      - name: Authenticate using existing protected deployment credential
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy tested rules, indexes and SPA exclusively to DEV
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes,hosting --project roteiva-web-dev --non-interactive
