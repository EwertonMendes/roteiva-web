name: Deploy Firebase Hosting (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Check Firebase configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Configure o repo variable FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Configure o secret FIREBASE_SERVICE_ACCOUNT"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test && pnpm run typecheck
      - run: pnpm run build && node scripts/verify-static-build.mjs dist /
      - name: Deploy static assets only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
