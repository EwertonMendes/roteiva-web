name: Publish institutional Hosting PROD
on:
  pull_request:
    branches: [master]
    paths:
      - 'firebase.site.prod.json'
      - 'scripts/stage-institutional-hosting.mjs'
      - 'scripts/verify-institutional-hosting.mjs'
      - 'scripts/wait-for-hosting-release.mjs'
      - 'playwright.hosting.config.ts'
      - 'tests/hosting/**'
      - 'public/**'
      - '.github/workflows/institutional-production.yml'
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved master SHA
        required: true
      confirmation:
        description: Type DEPLOY ROTEIVA SITE
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: roteiva-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.hosting.config.ts --reporter=list
  authorize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Require owner promotion of current approved master
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$CONFIRMATION" = 'DEPLOY ROTEIVA SITE'
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$APPROVED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_SHA/pulls" |
            jq -e 'any(.[]; .merged_at != null and .base.ref == "master")' >/dev/null
  hosting:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage public content after verifying the approved commit
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$PROJECT" = 'roteiva-web-prod'
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"
          node scripts/stage-institutional-hosting.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify deployment credential project
        run: node --input-type=module -e "import fs from 'node:fs';if(JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)).project_id!=='roteiva-web-prod')process.exit(1)"
      - name: Publish only the institutional site
        run: pnpm exec firebase deploy --config firebase.site.prod.json --only hosting:roteiva-site-prod --project roteiva-web-prod --non-interactive
      - run: node scripts/verify-institutional-hosting.mjs https://roteiva-site-prod.web.app
