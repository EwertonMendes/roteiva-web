name: Frontend DEV
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - '.env.firebase'
      - 'firebase.json'
      - 'scripts/verify-static-build.mjs'
      - 'scripts/verify-hosting-cache.mjs'
      - 'tests/*.test.mjs'
      - '.github/workflows/frontend.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'postcss.config.mjs'
      - '.env.firebase'
      - 'firebase.json'
      - 'scripts/verify-static-build.mjs'
      - 'scripts/verify-hosting-cache.mjs'
      - 'tests/*.test.mjs'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, type and Firebase Hosting contract
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
          node scripts/verify-static-build.mjs dist /
      - name: Reuse validated SPA output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: roteiva-frontend-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
  deploy:
    name: Deploy Firebase Hosting DEV
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: firebase-development
    concurrency:
      group: frontend-hosting-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: roteiva-frontend-dist
          path: dist/
      - name: Guard project and stale commit
        env:
          CONFIGURED_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$CONFIGURED_PROJECT" = "roteiva-web-dev"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" || {
            echo "Outdated SHA: skip stale DEV deploy"; exit 1;
          }
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish only Hosting (no redundant rules/indexes)
        run: pnpm exec firebase deploy --only hosting --project roteiva-web-dev --non-interactive
      - name: Verify published SPA cache
        run: node scripts/verify-hosting-cache.mjs https://roteiva-web-dev.web.app
